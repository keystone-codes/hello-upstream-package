name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version (must match keystone-service.yaml and pyproject.toml)
        required: true

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE: ghcr.io/keystone-codes/hello-upstream

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Validate version
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$v"
          test "$(grep -E '^version:' keystone-service.yaml | awk '{print $2}')" = "$v"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then echo "tag v$v already exists"; exit 1; fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q -m "not integration"

      - name: Package lint
        run: uvx keystonectl@0.1.0 lint keystone-service.yaml

      - name: Build image for scan
        run: docker build -t ${{ env.IMAGE }}:scan .

      # aquasecurity/trivy-action v0.36.0, pinned by the SHA of the commit
      # its tag points at. This scan blocks: a fixable CRITICAL or HIGH
      # finding fails the job and so the release, before anything is pushed.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.inputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Pin digest and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          branch="release/pin-$v"
          git checkout -b "$branch"
          uv run python scripts/pin_digest.py "${{ steps.build.outputs.digest }}"
          git add keystone-service.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: pin image digest for $v"
          git push -u origin "$branch"
          gh pr create --title "Pin hello-upstream image digest for $v" --body "$(cat <<EOF
          Release \`$v\` image digest: \`${{ steps.build.outputs.digest }}\`

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
