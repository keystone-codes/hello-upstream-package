name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q -m "not integration"

      - name: Docker build and healthcheck
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import secrets, pathlib
          path = pathlib.Path("hello.env")
          path.write_text(
              f"HELLO_BEARER_TOKEN={secrets.token_urlsafe(32)}\n"
              f"HELLO_IDENTITY_SECRET={secrets.token_urlsafe(32)}\n"
              f"HELLO_IDENTITY_AUDIENCE=hello-upstream\n",
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY
          docker build -t hello-upstream:ci .
          cid=$(docker run -d --env-file ./hello.env hello-upstream:ci)
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 1
          done
          docker logs "$cid"
          exit 1

  package-lint:
    name: Package lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: keystonectl lint
        run: uvx keystonectl@0.1.0 lint keystone-service.yaml
